<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💍 Marriage AIdvice - Host</title>

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  </head>

  <body>
    <audio id="bgm" loop>
      <source src="assets/bgm.wav" type="audio/wav" />
    </audio>
    <div id="host-loading-screen" class="loading-overlay">
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <div class="loading-title">Setting up the game...</div>
        <div class="loading-subtitle">Please wait a moment</div>
      </div>
    </div>

    <div class="game-container">
      <img
        src="assets/gamelogo.png"
        class="game-logo"
        alt="💍 Marriage AIdvice"
      />

      <p id="player-count">0 players joined</p>

      <div class="lobby" id="lobby" style="display: none">
        <div class="join-wrapper">
          <div class="join-box">
            <div class="qr-section">
              <img src="assets/qr.png" class="qr-image" />
            </div>

            <div class="code-section">
              <h2 class="join-label">Game Code</h2>
              <h1 id="room-code-large" class="room-code-big">----</h1>
            </div>
          </div>
        </div>
        <button id="start-game-btn" class="submit-btn" onclick="startGame()">
          Start Game
        </button>

        <div id="player-list" class="player-list"></div>
      </div>

      <div class="scenario-wrapper">
        <div class="scenario-header">
          <p id="answer-count" class="answer-counter" style="display: none"></p>
          <h2 id="host-timer" class="scenario-timer"></h2>
        </div>

        <div class="scenario-card" id="scenario-card" style="display: none">
          <h2 id="scenario">Waiting for round to start...</h2>
        </div>
      </div>

      <div class="scenario-card" id="winner-card" style="display: none">
        <div id="winner-loading" style="display: none">
          <div class="winner-inline-loader"></div>
          <p id="winner-loading-text">AI is choosing the funniest answer.</p>
        </div>

        <div id="winner-content">
          <h2 id="winner-title">🏆 Best Marriage Advice</h2>
          <p id="winner-answer"></p>
          <p id="winner-player"></p>
          <p id="winner-reason"></p>
        </div>
      </div>

      <div class="scenario-card" id="leaderboard-card" style="display: none">
        <h2>🏆 Prize Winners</h2>
        <div id="leaderboard-list"></div>
      </div>

      <div class="controls" style="display: none">
        <button
          id="evaluate-btn"
          style="display: none"
          class="submit-btn"
          onclick="evaluateAnswers()"
        >
          Evaluate Answers
        </button>

        <button
          id="next-round-btn"
          class="submit-btn"
          style="display: none"
          onclick="nextRound()"
        >
          Next Round
        </button>

        <button
          id="leaderboard-btn"
          class="submit-btn"
          onclick="showWinners()"
          style="display: none"
        >
          Show Winners
        </button>

        <button
          id="reset-btn"
          class="submit-btn"
          style="display: none"
          onclick="resetGame()"
        >
          Reset Game
        </button>
      </div>

      <div id="answers" class="answers-box"></div>
    </div>

    <script src="game.js"></script>
    <script src="js/loadTest.js"></script>
  </body>
</html>
