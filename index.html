<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💍 Marriage AIdvice</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  </head>

  <body>
    <div id="player-loading-screen" class="loading-overlay">
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <div class="loading-title">Loading your game...</div>
        <div class="loading-subtitle">Getting everything ready</div>
      </div>
    </div>

    <div id="join-screen" class="container" style="display: none">
      <img
        src="assets/gamelogo.png"
        class="game-logo"
        alt="💍 Marriage AIdvice"
      />

      <div class="join-card">
        <h3 class="join-title">
          Enter the room to give your best marriage advice!
        </h3>

        <input
          id="name"
          class="input"
          placeholder="Your name"
          autocomplete="on"
        />

        <div class="field-group">
          <input
            id="table"
            class="input"
            placeholder="Table number (e.g. VIP1 or 12)"
            style="text-transform: uppercase"
            autocomplete="on"
          />
          <p id="table-error" class="error-text"></p>
        </div>

        <div class="field-group">
          <input
            id="roomcode"
            class="input"
            placeholder="Room code"
            style="text-transform: uppercase"
            autocomplete="on"
          />
          <p id="roomcode-error" class="error-text"></p>
        </div>

        <button id="join-btn" class="submit-btn" onclick="joinGame()">
          Join Game
        </button>
      </div>
    </div>

    <div id="waiting-screen" style="display: none" class="container">
      <h1 class="title">Waiting for host to start...</h1>

      <div class="scenario-box">
        <p>Please look at the big screen.</p>
      </div>
    </div>

    <div id="answer-screen" style="display: none" class="container">
      <div id="player-info" class="player-info" style="display: none">
        <span id="player-name-display"></span>
        <span id="player-table-display"></span>
      </div>

      <div class="header-row">
        <h1 class="title">Give Your Advice</h1>
        <h2 id="timer" class="timer"></h2>
      </div>
      <div class="scenario-box">
        <p id="scenario">Loading scenario...</p>
      </div>

      <textarea
        id="answer"
        class="input"
        placeholder="Your marriage advice..."
        maxlength="120"
      ></textarea>

      <button id="submit-btn" onclick="submitAdvice()" class="submit-btn">
        Submit Advice
      </button>
      <p id="time-up-msg" class="time-up-msg" style="display: none">
        No more answers allowed.
      </p>
    </div>

    <div id="submitted-screen" style="display: none" class="container">
      <h1 class="title">✅ Advice Submitted!</h1>

      <div class="scenario-box">
        <p>Watch the big screen for the results!</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
